# Lisa + Bianca auf der 5090 — der stabile Umschlag fuer SIP/Zaluma.
#   cp .env.example .env   # einmal ausfuellen (Keys, TTS_BASE)
#   docker compose up -d --build
# Port-Landkarte 5090: vLLM 8000, Lisa 8095, Bianca 8096,
# Chatterbox 8210, CosyVoice 8211 (TTS-Stack: tts_serve/compose.yml),
# STT 8212 (stt_serve/compose.yml).
x-app: &app
  build: .
  image: telefonki:v1
  env_file: .env
  environment: &app-env
    # vLLM und TTS laufen auf dem HOST der 5090 (eigene Stacks) — darum
    # host-gateway statt Compose-Netz: die Stacks bleiben einzeln startbar.
    LLM_BASE: ${LLM_BASE:-http://host.docker.internal:8000/v1}
    # Leer = ElevenLabs. Lokal-TTS: http://host.docker.internal:8210
    # (Chatterbox) bzw. :8211 (CosyVoice). KEIN Fallback (Chef 27.08.2026).
    TTS_BASE: ${TTS_BASE:-}
    # Leer = ElevenLabs Scribe. Lokal-STT (deutscher Conformer):
    # http://host.docker.internal:8212. KEIN Fallback (Chef 28.08.2026).
    STT_BASE: ${STT_BASE:-}
  volumes:
    - ./tenants:/app/tenants:ro
    # Service-Account-Key (W-CALLAUDIO): Anruf-MP3 -> Firebase Storage.
    # Ordner darf leer sein — dann bleibt der Upload einfach aus.
    - ./secrets:/app/secrets:ro
    - telefonki-data:/app/.data
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped

services:
  lisa:
    <<: *app
    command: python -m uvicorn lisa.server:app --host 0.0.0.0 --port 8095
    environment:
      <<: *app-env
      # Outbound-Dial (CF -> Lisa -> Asterisk Call-File)
      LISA_OUTBOUND_API_TOKEN: ${LISA_OUTBOUND_API_TOKEN:-}
      ASTERISK_SSH: ${ASTERISK_SSH:-root@87.106.34.137}
      ASTERISK_SSH_KEY: ${ASTERISK_SSH_KEY:-/app/secrets/asterisk-cli-key}
      ASTERISK_SSH_PROXY: ${ASTERISK_SSH_PROXY:-}
    ports:
      - "8095:8095"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8095/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  bianca:
    <<: *app
    command: python -m uvicorn bianca.server:app --host 0.0.0.0 --port 8096
    environment:
      <<: *app-env
      # /studio-Proxy zeigt auf den Editor-Container (statt 127.0.0.1:8097)
      STUDIO_BASE: http://studio:8097
    volumes:
      - ./tenants:/app/tenants:ro
      - ./secrets:/app/secrets:ro
      - telefonki-data:/app/.data
      # Studio-Berichte + Autoloesch-Schlange teilt sich Bianca mit dem
      # Editor (Play-Buttons unter /studio/berichte, Testtermin-Waechter).
      - telefonki-berichte:/app/tests/baukasten/berichte
    ports:
      - "8096:8096"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8096/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Test-Studio (W-STUDIO-5090 30.08.2026): Test-Bianca, gegen die der
  # Editor seine Story-Anrufe fuehrt — NICHT die Live-Bianca (8096), damit
  # Testlaeufe nie einen echten Anruf stoeren. Nur im Compose-Netz erreichbar.
  bianca-test:
    <<: *app
    command: python -m uvicorn bianca.server:app --host 0.0.0.0 --port 8098
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8098/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Editor des Test-Studios (8097): fuehrt die Baukasten-Anrufe, rendert
  # Anrufer-Audio ueber TTS_BASE. Erreichbar NUR ueber Biancas /studio-Proxy.
  studio:
    <<: *app
    command: python -m uvicorn tests.baukasten.editor:app --host 0.0.0.0 --port 8097
    environment:
      <<: *app-env
      STUDIO_BIANCA_BASE: http://bianca-test:8098
    volumes:
      - ./tenants:/app/tenants:ro
      - telefonki-data:/app/.data
      - telefonki-berichte:/app/tests/baukasten/berichte
      # Anrufer-Audio-Cache: einmal gerendert, fuer immer wiederverwendbar
      - telefonki-klang:/app/tests/baukasten/audio
    depends_on:
      - bianca-test
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8097/api/laeufe', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # SIP-Bruecke (W-SIP 29.08.2026): Asterisk AudioSocket -> Bianca.
  # Der Asterisk erreicht Port 40101 ueber den SSH-Ruecktunnel
  # (systemd bianca-asterisk-tunnel auf dem Host) — darum nur 127.0.0.1.
  sipbridge:
    <<: *app
    command: python -m sip_bridge.server
    environment:
      <<: *app-env
      BIANCA_BASE: http://bianca:8096
      BRIDGE_MODE: inbound
      # 1 = Anrufer-Zuege als WAV nach /tmp mitschneiden (Feld-Diagnose)
      BRIDGE_DUMP: ${BRIDGE_DUMP:-0}
      # Daempfung Richtung Asterisk (W-SIP-PEGEL): 0.5 = -6 dB, 1.0 = aus
      BRIDGE_GAIN: ${BRIDGE_GAIN:-0.5}
      # Halbduplex-Echo-Sperre (W-SIP-ECHO-RAUS): 0 = aus (Default), 1 = an
      BRIDGE_ECHO: ${BRIDGE_ECHO:-0}
      # Sprachband-EQ+Kompressor vor dem STT (W-STIMME-EQ). 0 = aus.
      BRIDGE_STIMME: ${BRIDGE_STIMME:-1}
      # Ruhe zwischen Abheben und Begruessung in Sekunden (W-START-RUHE),
      # /api/start-Zeit wird angerechnet; 0 = aus
      BRIDGE_START_RUHE_S: ${BRIDGE_START_RUHE_S:-1.0}
      # UUID-Ende -> angerufene Nummer (W-MANDANT). 4105 = Thaler Zahnmedizin.
      BRIDGE_DID_MAP: ${BRIDGE_DID_MAP:-4101=+4921154244101,4110=+4921154244110,4120=+4921154244120,4105=+4921154244105}
    depends_on:
      - bianca
    ports:
      - "127.0.0.1:40101:40101"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import socket; socket.create_connection(('127.0.0.1', 40101), timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Lisa-Outbound-Bruecke (W-LISA-OUT): Cold-Call AudioSocket auf 40102.
  # Eigene Instanz — Bianca-Inbound (40101) bleibt unangetastet.
  sipbridge-lisa:
    <<: *app
    command: python -m sip_bridge.server
    environment:
      <<: *app-env
      LISA_BASE: http://lisa:8095
      BIANCA_BASE: http://lisa:8095
      BRIDGE_PORT: "40102"
      BRIDGE_MODE: outbound
      BRIDGE_DUMP: ${BRIDGE_DUMP:-0}
      BRIDGE_GAIN: ${BRIDGE_GAIN:-0.5}
      BRIDGE_ECHO: ${BRIDGE_ECHO:-0}
      BRIDGE_STIMME: ${BRIDGE_STIMME:-1}
      BRIDGE_START_RUHE_S: ${BRIDGE_START_RUHE_S:-1.0}
    depends_on:
      - lisa
    ports:
      - "127.0.0.1:40102:40102"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import socket; socket.create_connection(('127.0.0.1', 40102), timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Oeffentlicher Cloudflare-Tunnel fuer Lisa-Outbound (CF -> pickadoc1:8095).
  # Named Tunnel (Zero Trust), Token in .env: CLOUDFLARE_TELEFONKI_TOKEN
  # Public Hostname in CF-UI: lisa-live.pickadoc-tunnel.com -> http://localhost:8095
  # (network_mode:host, damit localhost die Host-Lisa meint).
  lisa-public:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    network_mode: host
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TELEFONKI_TOKEN:-}
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TELEFONKI_TOKEN}
    depends_on:
      - lisa

  # SSH-Ruecktunnel zum Asterisk (W-SIP): haelt auf dem Asterisk-Server
  # 127.0.0.1:40101 und :40102 offen. Der Schluessel ist auf dem Asterisk
  # mit permitlisten auf GENAU diese Ports beschraenkt — keine Shell.
  tunnel:
    image: alpine:3.20
    restart: unless-stopped
    depends_on:
      - sipbridge
      - sipbridge-lisa
    volumes:
      - ${TUNNEL_KEY:-/home/cursor/.ssh/id_ed25519_asterisk_tunnel}:/tunnel_key:ro
    command: >
      sh -c "apk add --no-cache openssh-client >/dev/null
      && install -m 600 /tunnel_key /tmp/key
      && exec ssh -N
      -o StrictHostKeyChecking=accept-new
      -o ServerAliveInterval=15 -o ServerAliveCountMax=3
      -o ExitOnForwardFailure=yes
      -i /tmp/key
      -R 127.0.0.1:40101:sipbridge:40101
      -R 127.0.0.1:40102:sipbridge-lisa:40102
      ${ASTERISK_SSH:-root@87.106.34.137}"

volumes:
  telefonki-data:
  telefonki-berichte:
  telefonki-klang:
