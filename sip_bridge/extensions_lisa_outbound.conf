; Lisa Outbound (telefonki auf pickadoc1) — Cold-Call ueber Zaluma.
; REFERENZKOPIE: sip_bridge/extensions_lisa_outbound.conf
; Live: /etc/asterisk/extensions_lisa_outbound.conf + #include in
; extensions.conf NEBEN Bianca (nicht in [from-zaluma] / Bianca-DID-Bloecken).
;
; Weg: Originate (Call-File oder Local) -> Dial zaluma-trunk -> Answer ->
; AudioSocket auf 127.0.0.1:40102 (SSH-Ruecktunnel -> sipbridge-lisa -> Lisa 8095).
; Kein Eingriff in Bianca-Inbound (40101 / extensions_bianca.conf).
;
; Kanalvariablen (von Call-File Setvar / Originate):
;   __LUUID   = AudioSocket-UUID (mit Bindestrichen)
;   __FROMDID = Praxis-CallerID (+E164)

[lisa-outbound]
; EXTEN = Patientennummer +E164 (z. B. +491701234567)
exten => _+X.,1,NoOp(Lisa Outbound -> ${EXTEN} uuid=${LUUID} from=${FROMDID})
 same => n,ExecIf($["${FROMDID}"!=""]?Set(CALLERID(num)=${FROMDID}))
 same => n,ExecIf($["${LUUID}"=""]?Hangup())
 same => n,Dial(PJSIP/zaluma-trunk/sip:${EXTEN}@vc.zaluma.tel,60,U(lisa-audiosocket^${LUUID}))
 same => n,Hangup()

; Ohne Plus: Ziffern -> mit + waehlen (Zaluma erwartet +E164)
exten => _X.,1,NoOp(Lisa Outbound digits ${EXTEN})
 same => n,Goto(+${EXTEN},1)

; Gosub auf dem angerufenen Kanal nach Answer (Option U)
[lisa-audiosocket]
exten => s,1,NoOp(Lisa AudioSocket ${ARG1})
 same => n,AudioSocket(${ARG1},127.0.0.1:40102)
 same => n,Return()
