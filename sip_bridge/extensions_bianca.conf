; Bianca (telefonki auf pickadoc1) - W-SIP 29.08.2026.
; AudioSocket ueber SSH-Ruecktunnel: 127.0.0.1:40101 -> pickadoc1 sip_bridge -> Bianca 8096.
; Diese Datei pflegt NICHT die Number-API - sie wird aus extensions.conf
; direkt eingebunden und ueberlebt jede API-Regenerierung.
; REFERENZKOPIE im Repo: sip_bridge/extensions_bianca.conf — Aenderungen
; immer in BEIDEN Fassungen (Repo + /etc/asterisk auf asterisk-strato).
;
; W-SIP-SLIN 30.08.2026: AudioSocket()-APPLIKATION statt Dial(AudioSocket/...).
; Der Kanaltreiber (Dial) handelt den nativen Codec aus und reichte G.711
; UNKONVERTIERT durch - A-law-Anrufer gingen, aber ulaw-Strecken (je nach
; Zubringer des Anrufers) wurden von der Bruecke mit der A-law-Kennlinie
; dekodiert = uebel verzerrt. Die Applikation zwingt den Kanal auf slin,
; Asterisk transkodiert selbst - die Bruecke bekommt IMMER slin (320-Byte-
; Frames) und muss nie mehr raten.
;
; W-ANRUFER 30.08.2026: AudioSocket uebergibt nur die UUID - deshalb traegt
; ihr KOPF (die ersten 20 Hex-Zeichen) jetzt die Anrufernummer: CALLERID-
; Ziffern (FILTER 0-9, Ziffern sind gueltige Hex-Zeichen) rechtsbuendig,
; links mit 'f' gepolstert. Unterdrueckte Nummer = reines f-Polster.
; Das UUID-ENDE bleibt die feste DID-Kennung (...4101/...4110), die die
; Bruecke via BRIDGE_DID_MAP in die angerufene Nummer uebersetzt.
; Die Bruecke (caller_von_uuid) meldet die Nummer an Bianca /api/start ->
; onPickadocPhoneCall bekommt callerPhone (+E164) -> das Portal zeigt
; Nummer + Patient statt "Unterdrueckte Nummer".

exten => 21154244101,1,NoOp(Bianca telefonki AudioSocket)
 same => n,Answer()
 same => n,Set(ZIFFERN=${FILTER(0-9,${CALLERID(num)})})
 same => n,Set(KOPF=ffffffffffffffffffff${ZIFFERN})
 same => n,Set(KOPF=${KOPF:-20})
 same => n,AudioSocket(${KOPF:0:8}-${KOPF:8:4}-${KOPF:12:4}-${KOPF:16:4}-000000004101,127.0.0.1:40101)
 same => n,Hangup()

exten => +21154244101,1,NoOp(Bianca telefonki AudioSocket +)
 same => n,Answer()
 same => n,Set(ZIFFERN=${FILTER(0-9,${CALLERID(num)})})
 same => n,Set(KOPF=ffffffffffffffffffff${ZIFFERN})
