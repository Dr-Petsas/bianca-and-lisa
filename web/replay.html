t_heute": "Ja.", "antwort_orig": "Danke, Peter Mayer. Wissen Sie noch, bei welchem Behandler Sie zuletzt waren?", "antwort_heute": "Danke, Peter Mayer. Wissen Sie noch, bei welchem Behandler Sie zuletzt waren?", "stt_gleich": true, "antwort_gleich": true, "frage": "arzt", "fehler": "", "art": "listen"}, {"nr": 35, "sid": "405669eb", "wann": "2026-09-08T08:09:18", "score": 0, "name": "Peter Mayer", "input_orig": "Bin ich mal ein Zahnarzt?", "stt_heute": "Bin ich mal ein Zahnarzt?", "antwort_orig": "Äh, ich muss kurz nachsehen. Sind Sie Herr Peter Mayer?", "antwort_heute": "Äh, ich muss kurz nachsehen. Sind Sie Herr Peter Mayer?", "stt_gleich": true, "antwort_gleich": true, "frage": "arzt", "fehler": "", "art": "listen"}, {"nr": 36, "sid": "405669eb", "wann": "2026-09-08T08:09:18", "score": 0, "name": "Peter Mayer", "input_orig": "Ja.", "stt_heute": "Ja.", "antwort_orig": "Danke, Peter. Bei uns in der Praxis arbeiten drei Ärztinnen. Wollen Sie zu einer von ihnen?", "antwort_heute": "Danke, Peter. Bei uns in der Praxis arbeiten drei Ärztinnen. Wollen Sie zu einer von ihnen?", "stt_gleich": true, "antwort_gleich": true, "frage": "arzt", "fehler": "", "art": "listen"}, {"nr": 37, "sid": "405669eb", "wann": "2026-09-08T08:09:18", "score": 0, "name": "Peter Mayer", "input_orig": "Ja, also Frau Doktor, Blessing.", "stt_heute": "Ja, also Frau Doktor, Blessing.", "antwort_orig": "Wann passt es Ihnen am besten — eher vormittags oder nachmittags?", "antwort_heute": "Wann passt es Ihnen am besten — eher vormittags oder nachmittags?", "stt_gleich": true, "antwort_gleich": true, "frage": "wunsch", "fehler": "", "art": "listen"}, {"nr": 38, "sid": "405669eb", "wann": "2026-09-08T08:09:18", "score": 0, "name": "Peter Mayer", "input_orig": "Vorwesungs.", "stt_heute": "Vorwesungs.", "antwort_orig": "Das habe ich nicht verstanden. Bitte noch einmal.", "antwort_heute": "Das habe ich nicht verstanden. Bitte noch einmal.", "stt_gleich": true, "antwort_gleich": true, "frage": "wunsch", "fehler": "", "art": "listen"}, {"nr": 39, "sid": "405669eb", "wann": "2026-09-08T08:09:18", "score": 0, "name": "Peter Mayer", "input_orig": "Vormittags", "stt_heute": "Vormittags", "antwort_orig": "Gut. Frei ist am Donnerstag, den achten Oktober um zehn Uhr zwanzig; oder am Donnerstag, den achten Oktober um vierzehn Uhr. Welcher passt Ihnen?", "antwort_heute": "Gut. Frei ist am Donnerstag, den achten Oktober um zehn Uhr zwanzig; oder am Donnerstag, den achten Oktober um vierzehn Uhr. Welcher passt Ihnen?", "stt_gleich": true, "antwort_gleich": true, "frage": "slotwahl", "fehler": "", "art": "listen"}, {"nr": 40, "sid": "405669eb", "wann": "2026-09-08T08:09:18", "score": 0, "name": "Peter Mayer", "input_orig": "Am 8. Oktober um 14 Uhr.", "stt_heute": "Am 8. Oktober um 14 Uhr.", "antwort_orig": "Einen Moment bitte. Dann halte ich fest: Kontrolluntersuchung, am Donnerstag, den achten Oktober um vierzehn Uhr, bei Blessing, für Herrn Mayer. Soll ich das so eintragen?", "antwort_heute": "Einen Moment bitte. Dann halte ich fest: Kontrolluntersuchung, am Donnerstag, den achten Oktober um vierzehn Uhr, bei Blessing, für Herrn Mayer. Soll ich das so eintragen?", "stt_gleich": true, "antwort_gleich": true, "frage": "bestaetigung", "fehler": "", "art": "listen"}, {"nr": 41, "sid": "405669eb", "wann": "2026-09-08T08:09:18", "score": 0, "name": "Peter Mayer", "input_orig": "zur Zahnreinigung, bitte.", "stt_heute": "zur Zahnreinigung, bitte.", "antwort_orig": "Ganz kurz bitte. Entschuldigung, das habe ich akustisch nicht verstanden — soll ich den Termin so eintragen? Ein kurzes Ja genügt.", "antwort_heute": "Ganz kurz bitte. Entschuldigung, das habe ich akustisch nicht verstanden — soll ich den Termin so eintragen? Ein kurzes Ja genügt.", "stt_gleich": true, "antwort_gleich": true, "frage": "bestaetigung", "fehler": "", "art": "listen"}, {"nr": 42, "sid": "405669eb", "wann": "2026-09-08T08:09:18", "score": 0, "name": "Peter Mayer", "input_orig": "Ja, bitte notieren Sie zur Zahlreinigung.", "stt_heute": "Ja, bitte notieren Sie zur Zahlreinigung.", "antwort_orig": "Einen Moment bitte. Der Termin ist gerade weg. Frei ist am Donnerstag, den achten Oktober um zehn Uhr zwanzig; oder am Donnerstag, den achten Oktober um vierzehn Uhr zehn. Welcher davon passt Ihnen?", "antwort_heute": "Einen Moment bitte. Der Termin ist gerade weg. Frei ist am Donnerstag, den achten Oktober um zehn Uhr zwanzig; oder am Donnerstag, den achten Oktober um vierzehn Uhr zehn. Welcher davon passt Ihnen?", "stt_gleich": true, "antwort_gleich": true, "frage": "slotwahl", "fehler": "", "art": "listen"}, {"nr": 43, "sid": "405669eb", "wann": "2026-09-08T08:09:18", "score": 0, "name": "Peter Mayer", "input_orig": "um 14.10.", "stt_heute": "um 14.10.", "antwort_orig": "Alles klar, ich trage das eben ein. Der Termin ist leider gerade nicht mehr frei, und die Alternativen klappen auch nicht zuverlässig. Keine Sorge — ich schreibe eine Notiz, und die Praxis meldet sich gleich bei Ihnen mit einem Termin. Kann ich sonst noch etwas für Sie tun?", "antwort_heute": "Alles klar, ich trage das eben ein. Der Termin ist leider gerade nicht mehr frei, und die Alternativen klappen auch nicht zuverlässig. Keine Sorge — ich schreibe eine Notiz, und die Praxis meldet sich gleich bei Ihnen mit einem Termin. Kann ich sonst noch etwas für Sie tun?", "stt_gleich": true, "antwort_gleich": true, "frage": "", "fehler": "", "art": "listen"}, {"nr": 44, "sid": "7530b1c8", "wann": "2026-09-08T08:16:50", "score": 0, "name": "Michael Petsas", "input_orig": "", "stt_heute": "", "antwort_orig": "Zahnärzte im Medical Center, guten Tag! Mein Name ist Bianca. Was kann ich für Sie tun?", "antwort_heute": "Zahnärzte im Medical Center, guten Tag! Mein Name ist Bianca. Was kann ich für Sie tun?", "stt_gleich": true, "antwort_gleich": true, "frage": "", "fehler": "", "art": "start"}, {"nr": 45, "sid": "7530b1c8", "wann": "2026-09-08T08:16:50", "score": 0, "name": "Michael Petsas", "input_orig": "Hallo, ich hätte gern   <script>
    const rows = JSON.parse(document.getElementById("DATA").textContent || "[]");
    const list = document.getElementById("list");
    let filter = "alle";
    const esc = (s) => String(s || "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
    const box = (lab, cls, t) => `<div class="row"><div class="lab ${cls}">${lab}</div><div class="txt${t ? "" : " empty"}">${t ? esc(t) : "— leer —"}</div></div>`;
    function pass(r) {
      if (filter === "stt" && r.stt_gleich) return false;
      if (filter === "ant" && r.antwort_gleich) return false;
      if (filter === "besser" && !r.fehler && r.antwort_heute) return false;
      const q = (document.getElementById("q").value || "").toLowerCase();
      if (!q) return true;
      return [r.input_orig, r.stt_heute, r.antwort_orig, r.antwort_heute, r.sid, r.frage, r.name]
        .join(" ").toLowerCase().includes(q);
    }
    function render() {
      const vis = rows.filter(pass);
      list.innerHTML = vis.map(r => {
        const gleich = r.stt_gleich && r.antwort_gleich;
        return `
        <article class="card">
          <div class="meta">
            <b>#${r.nr}</b>
            <span>${esc(r.wann || "").replace("T"," ")}</span>
            <span>${esc(r.sid)}</span>
            ${r.name ? `<span class="chip ok">${esc(r.name)}</span>` : ""}
            ${gleich ? "" : `<span class="chip ${r.stt_gleich ? "ok" : "warn"}">STT ${r.stt_gleich ? "gleich" : "anders"}</span>`}
            ${gleich ? "" : `<span class="chip ${r.antwort_gleich ? "ok" : "bad"}">Antwort ${r.antwort_gleich ? "gleich" : "anders"}</span>`}
            ${r.frage ? `<span>Frage: ${esc(r.frage)}</span>` : ""}
            ${r.fehler ? `<span class="chip bad">${esc(r.fehler)}</span>` : ""}
          </div>
          ${box("Anrufer", "in", r.input_orig)}
          ${gleich ? "" : box("STT heute", "in", r.stt_heute)}
          ${box("Bianca", gleich ? "now" : "old", r.antwort_orig)}
          ${gleich ? "" : box("Bianca heute", "now", r.antwort_heute)}
        </article>`;
      }).join("") || `<p class="sub">Keine Treffer.</p>`;
    }
    const n = rows.length;
    const sttA = rows.filter(r => !r.stt_gleich).length;
    const antA = rows.filter(r => !r.antwort_gleich).length;
    const err = rows.filter(r => r.fehler).length;
    document.getElementById("stats").innerHTML =
      `<span class="stat"><b>${n}</b> Fälle</span>` +
      `<span class="stat"><b>${sttA}</b> STT anders</span>` +
      `<span class="stat"><b>${antA}</b> Antwort anders</span>` +
      `<span class="stat"><b>${n - antA}</b> Antwort gleich</span>` +
      (err ? `<span class="stat"><b>${err}</b> Fehler</span>` : "");
    document.querySelectorAll(".filters button").forEach(b => b.onclick = () => {
      filter = b.dataset.f;
      document.querySelectorAll(".filters button").forEach(x => x.classList.toggle("on", x === b));
      render();
    });
    document.getElementById("q").addEventListener("input", render);
    render();
  </script>
