<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Lisa-Draht — Grok</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: ui-sans-serif, system-ui, sans-serif;
    background: #0c0e12;
    color: #ece8e1;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }
  header { padding: 12px 16px 8px; border-bottom: 1px solid #2a241c; }
  h1 { margin: 0; font-size: 16px; letter-spacing: .04em; }
  .sub { color: #8a8278; font-size: 12px; margin-top: 4px; }
  #log {
    flex: 1; overflow-y: auto; padding: 12px 14px 8px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg {
    max-width: 92%; padding: 10px 12px; border-radius: 14px;
    font-size: 15px; line-height: 1.4; white-space: pre-wrap; word-break: break-word;
  }
  .me { align-self: flex-end; background: #2a241c; }
  .agent { align-self: flex-start; background: #1a1d24; border: 1px solid #2a241c; }
  .sys { align-self: center; color: #8a8278; font-size: 12px; }
  .board {
    background: #16131a; border: 1px solid #3a2a18; border-radius: 12px;
    padding: 10px 12px; font-size: 13px; color: #d8c8a8; white-space: pre-wrap;
  }
  footer {
    display: flex; gap: 8px; align-items: flex-end;
    padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid #2a241c; background: #0c0e12;
  }
  textarea {
    flex: 1; min-height: 44px; max-height: 140px; resize: none;
    border: 1px solid #2a241c; background: #12141a; color: inherit;
    border-radius: 12px; padding: 10px 12px; font: inherit; font-size: 16px;
  }
  button {
    border: 0; background: #c45c26; color: #fff; border-radius: 12px;
    padding: 0 16px; font-weight: 700; min-width: 72px; min-height: 44px;
  }
  button:disabled { opacity: .45; }
  .clip {
    background: #1a1d24; color: #ece8e1; min-width: 44px; padding: 0;
  }
  .err { color: #e07a6a; font-size: 13px; padding: 0 16px 8px; }
  input[type=file] { display: none; }
</style>
</head>
<body>
<header>
  <h1>Lisa-Draht · nur Grok</h1>
  <div class="sub" id="meta">nur dieses Projekt · Port 8095</div>
</header>
<div id="log"></div>
<div class="err" id="err"></div>
<footer>
  <button class="clip" id="clip" type="button" aria-label="Datei">📎</button>
  <input id="file" type="file" accept="image/*,.png,.jpg,.jpeg,.webp,.pdf,.txt">
  <textarea id="box" rows="1" placeholder="Anweisung an Grok — nur Lisa-Telefon-KI"></textarea>
  <button id="send" type="button">Senden</button>
</footer>
<script>
const token = decodeURIComponent(
  ((location.hash.match(/[#&]t=([^&]+)/) || location.search.match(/[?&]t=([^&]+)/) || [])[1] || "")
);
const logEl = document.getElementById("log");
const errEl = document.getElementById("err");
const box = document.getElementById("box");
const sendBtn = document.getElementById("send");
const file = document.getElementById("file");

function boardText(s) {
  if (!s || !s.board) return "";
  return typeof s.board === "string" ? s.board : (s.board.text || "");
}

function render(s) {
  logEl.innerHTML = "";
  const sys = document.createElement("div");
  sys.className = "sys";
  sys.textContent = "Draht offen. Nachrichten gehen nur an Grok in diesem Lisa-Ordner.";
  logEl.appendChild(sys);
  for (const m of (s.messages || [])) {
    const d = document.createElement("div");
    d.className = "msg " + (m.role === "agent" ? "agent" : "me");
    d.textContent = m.text || "";
    logEl.appendChild(d);
  }
  const b = boardText(s);
  if (b) {
    const d = document.createElement("div");
    d.className = "board";
    d.textContent = b;
    logEl.appendChild(d);
  }
  logEl.scrollTop = logEl.scrollHeight;
}

function mitToken(obj) {
  if (token) obj.token = token;
  return obj;
}

function stateUrl() {
  return "/remote/state?limit=120" + (token ? "&token=" + encodeURIComponent(token) : "");
}

async function poll() {
  try {
    const r = await fetch(stateUrl(), { cache: "no-store" });
    if (r.status === 401) {
      errEl.textContent = "Kein Zugang. Vom Handy den Link mit Token öffnen (SMS oder vom PC).";
      return;
    }
    const s = await r.json();
    if (!s.ok) throw new Error("Draht antwortet nicht");
    errEl.textContent = "";
    document.getElementById("meta").textContent = s.hint || "Lisa · Grok · 8095";
    render(s);
  } catch (e) {
    errEl.textContent = String(e.message || e);
  }
}

async function senden() {
  const text = box.value.trim();
  if (!text) return;
  sendBtn.disabled = true;
  errEl.textContent = "";
  try {
    const r = await fetch("/remote/message", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(mitToken({ role: "user", text })),
    });
    const data = await r.json();
    if (!r.ok || !data.ok) throw new Error(data.detail || data.reason || "senden fehlgeschlagen");
    box.value = "";
    setTimeout(poll, 300);
  } catch (e) {
    errEl.textContent = String(e.message || e);
  }
  sendBtn.disabled = false;
}

async function upload(dateien) {
  const liste = Array.prototype.slice.call(dateien || []);
  if (!liste.length) return;
  const note = box.value.trim();
  try {
    for (const f of liste) {
      const daten = await new Promise((ok, fail) => {
        const leser = new FileReader();
        leser.onerror = () => fail(new Error("Datei nicht lesbar"));
        leser.onload = () => ok(String(leser.result || ""));
        leser.readAsDataURL(f);
      });
      const r = await fetch("/remote/upload", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(mitToken({ name: f.name, data: daten, note })),
      });
      const data = await r.json();
      if (!r.ok || !data.ok) throw new Error(data.reason || data.detail || "upload");
    }
    box.value = "";
    setTimeout(poll, 300);
  } catch (e) {
    errEl.textContent = String(e.message || e);
  }
  file.value = "";
}

document.getElementById("clip").onclick = () => file.click();
file.onchange = () => upload(file.files);
sendBtn.onclick = senden;
box.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); senden(); }
});
poll();
setInterval(poll, 2500);
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
</script>
</body>
</html>
