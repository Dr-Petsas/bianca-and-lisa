<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Bianca &amp; Lisa — Telefon-KI</title>
  <link rel="stylesheet" href="/styles.css?v=call21" />
</head>
<body>
  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="bianca" type="button">
      Bianca <span class="tabsub">nimmt Anrufe an</span>
    </button>
    <button class="tab" data-tab="lisa" type="button">
      Lisa <span class="tabsub">ruft Patienten an</span>
    </button>
  </nav>

  <div id="tab-lisa" hidden>
    <div class="wrap">
      <header>
        <div>
          <h1>Lisa</h1>
          <div class="sub tts-info" id="ttsInfo"></div>
        </div>
        <div>
          <div class="sub last-call" id="lastCall"></div>
        </div>
      </header>

      <div class="grid">
        <section class="card">
          <h2>Auftrag</h2>
          <label for="tenant">Mandant</label>
          <select id="tenant"></select>
          <label for="prompt">Was Lisa ausrichten soll</label>
          <textarea id="prompt" placeholder="z. B. Wir möchten Ihren Kontrolltermin vorverlegen — nächste Woche ist ein Platz frei."></textarea>
          <div class="row" style="margin-top:10px">
            <button class="btn ghost mic" id="micPrompt" type="button">Prompt diktieren</button>
            <span class="sub" id="promptLive"></span>
          </div>
        </section>

        <section class="card">
          <h2>Patient</h2>
          <label for="who">Wen ruft Lisa an?</label>
          <div class="row">
            <input id="who" type="text" placeholder="Name eingeben?" autocomplete="off" />
            <button class="btn ghost" id="suchen" type="button">Suchen</button>
          </div>
          <div class="hits" id="hits"></div>
          <div id="person" hidden>
            <div class="who" id="personName"></div>
            <div class="phone-line" id="phones"></div>
            <div class="devhint">Dev: es klingelt bei dir, nicht beim Patienten.</div>
            <div class="appts">
              <div>
                <strong>Letzte Termine</strong>
                <ul id="past"></ul>
              </div>
              <div>
                <strong>Nächste Termine</strong>
                <ul id="upcoming"></ul>
              </div>
            </div>
          </div>
        </section>
      </div>
      <div class="status" id="status"></div>
    </div>
    <div class="toast" id="toast" hidden></div>

    <div id="call" class="call">
      <div class="call-top">
        <div class="call-name" id="callName">Lisa</div>
        <div class="call-phase" id="phase">verbindet…</div>
      </div>
      <div class="call-pulse" id="pulse"></div>
      <div class="live call-live" id="live"></div>
      <button class="btn hang" id="hang" type="button">Auflegen</button>
    </div>

    <div class="dock" id="dock">
      <button class="btn" id="start" type="button">Anruf starten</button>
    </div>
    <audio id="speaker" playsinline webkit-playsinline hidden></audio>
  </div>

  <div id="tab-bianca">
    <iframe id="biancaFrame" class="tab-frame" title="Bianca — Patiententelefon"
            allow="microphone; autoplay"></iframe>
    <div class="tab-frame-hinweis" id="biancaHinweis" hidden>
      Bianca antwortet nicht. Läuft ihr Dienst? <code>start-bianca.ps1</code> (Port 8096)
    </div>
  </div>

  <script>
    (function () {
      var frame = document.getElementById("biancaFrame");
      var hinweis = document.getElementById("biancaHinweis");
      var geladen = false;

      function zeige(tab) {
        document.getElementById("tab-lisa").hidden = tab !== "lisa";
        document.getElementById("tab-bianca").hidden = tab !== "bianca";
        document.body.classList.toggle("bianca-aktiv", tab === "bianca");
        var knoepfe = document.querySelectorAll("#tabs .tab");
        for (var i = 0; i < knoepfe.length; i++) {
          knoepfe[i].classList.toggle("active", knoepfe[i].dataset.tab === tab);
        }
        if (tab === "bianca" && !geladen) {
          geladen = true;
          // Bianca laeuft hinter Lisas Durchreiche (/bianca/ -> Port 8096) —
          // so funktioniert sie auch durch den Cloudflare-Tunnel, wo :8096
          // von aussen nicht erreichbar ist.
          fetch("/bianca/health")
            .then(function (r) {
              if (!r.ok) throw new Error("bianca down");
              frame.src = "/bianca/";
            })
            .catch(function () { hinweis.hidden = false; });
        }
        try { localStorage.setItem("tab2", tab); } catch (e) {}
        if (location.hash !== "#" + tab) {
          history.replaceState(null, "", "#" + tab);
        }
      }

      document.getElementById("tabs").addEventListener("click", function (ev) {
        var b = ev.target.closest(".tab");
        if (b) zeige(b.dataset.tab);
      });

      // Direktsprung per Adresse (#bianca / #lisa) auch OHNE Neuladen.
      window.addEventListener("hashchange", function () {
        if (location.hash === "#bianca") zeige("bianca");
        if (location.hash === "#lisa") zeige("lisa");
      });

      // Startseite ist BIANCA (Chef 27.08.2026) — #lisa oder eine zuvor
      // bewusst gewaehlte Lisa-Ansicht (neuer Speicher-Schluessel) gewinnt.
      var start = "bianca";
      if (location.hash === "#lisa") start = "lisa";
      else if (!location.hash) {
        try { if (localStorage.getItem("tab2") === "lisa") start = "lisa"; } catch (e) {}
      }
      zeige(start);
    })();
  </script>
  <script src="/app.js?v=call32"></script>
</body>
</html>
