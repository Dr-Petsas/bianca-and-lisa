# Parakeet-STT auf der 5090 — Port 8212 (Landkarte: vLLM 8000, Lisa 8095,
# Bianca 8096, Chatterbox 8210, CosyVoice 8211, STT 8212).
#
# CPU-only (wie Claras Produktions-Parakeet): KEINE GPU-Reservation, damit
# qwen-vLLM und der TTS-Container unberuehrt bleiben.
#
# Modell: ./modell (parakeet-primeline-onnx, 2,5 GB) — kommt per scp aus
# Claras Cache (nur lesend) bzw. HF geier/deskscribe-parakeet-primeline-onnx.
# Bewusst Bind-Mount statt Volume: transparent, ohne Download-Logik im Image.
services:
  stt:
    build: .
    image: stt-parakeet-de:v1
    ports:
      - "8212:8100"
    volumes:
      - ./modell:/modell:ro
    environment:
      # Stille-Trim-Notaus (W-STT-TRIM): STT_TRIM=0 => Alt-Verhalten ohne Trim.
      STT_TRIM: "${STT_TRIM:-1}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
