<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Bianca — Anrufe</title>
  <style>
    :root {
      --bg: #141013; --card: #211a20; --line: #382c35; --text: #efe8ec;
      --muted: #a38f9c; --accent: #ba3d78; --warn: #e0b15a; --ki: #c87eb0;
      --user: #d7c9a3; --gut: #7fbf8e;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 16px 14px 40px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
    h1 { font-size: 22px; font-weight: 650; margin: 0; }
    .sub { color: var(--muted); font-size: 13px; }
    a.knopf, button.knopf {
      appearance: none; display: inline-block; padding: 8px 12px; border-radius: 10px;
      background: var(--card); border: 1px solid var(--line); color: var(--text);
      font-size: 13px; font-weight: 600; text-decoration: none; cursor: pointer; font: inherit;
    }
    a.knopf:hover, button.knopf:hover { background: #2a2128; }
    button.knopf.rot { border-color: #6b3440; color: #d99; }
    .grid { display: grid; grid-template-columns: 340px 1fr; gap: 12px; align-items: start; }
    @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
    .card h2 { margin: 0 0 10px; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    .liste { display: flex; flex-direction: column; gap: 6px; max-height: 78vh; overflow: auto; }
    .eintrag { border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; cursor: pointer; }
    .eintrag:hover { background: #2a2128; }
    .eintrag.aktiv { border-color: var(--accent); background: #2a1c26; }
    .e-kopf { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: 600; }
    .e-meta { color: var(--muted); font-size: 12px; margin-top: 3px; display: flex; gap: 10px; flex-wrap: wrap; }
    .marke { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
    .marke.gruen { color: var(--gut); border-color: #3c5a46; }
    .marke.gelb { color: var(--warn); border-color: #6b5a34; }
    .marke.grau { color: var(--muted); }
    .detail-kopf { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
    .zeiten { color: var(--muted); font-size: 13px; line-height: 1.6; }
    .zeiten b { color: var(--text); font-weight: 600; }
    .uid-zeile { margin-top: 6px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; }
    .uid-sep { color: var(--muted); }
    code.uid {
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      font-size: 12px; color: var(--text); background: #171114;
      border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px;
      user-select: all; word-break: break-all;
    }
    button.kopie {
      appearance: none; border: 1px solid var(--line); border-radius: 6px; cursor: pointer;
      background: #171114; color: var(--muted); font: inherit; font-size: 11px; padding: 1px 8px;
    }
    button.kopie:hover { color: var(--text); background: #2a2128; }
    .zuege { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; max-height: 62vh; overflow: auto; }
    .bubble { padding: 9px 12px; border-radius: 12px; max-width: 92%; font-size: 15px; line-height: 1.4; }
    .bubble.ki { background: #33202c; color: var(--ki); align-self: flex-start; }
    .bubble.user { background: #2a2618; color: var(--user); align-self: flex-end; }
    .bubble.sys { color: var(--muted); font-size: 12px; align-self: center; background: none; padding: 2px 0; }
    .b-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; font-size: 11px; color: var(--muted); }
    .chip { border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; white-space: nowrap; }
    .play {
      appearance: none; border: 1px solid var(--line); border-radius: 999px; cursor: pointer;
      background: #171114; color: var(--text); font: inherit; font-size: 11px; padding: 1px 9px;
    }
    .play:hover { background: #2a2128; }
    .play.laeuft { border-color: var(--accent); color: var(--accent); }
    .leer { color: var(--muted); font-size: 14px; padding: 20px 6px; }
    /* W-TOOL-UI: CF-Dispatch in der Unterhaltung */
    .tool-card {
      align-self: stretch; max-width: 100%;
      background: #1a1519; border: 1px solid var(--line); border-radius: 12px;
      padding: 0; font-size: 12px; color: var(--muted);
    }
    .tool-card > summary {
      list-style: none; cursor: pointer; display: flex; align-items: center;
      gap: 8px; flex-wrap: wrap; padding: 9px 12px; user-select: none;
    }
    .tool-card > summary::-webkit-details-marker { display: none; }
    .tool-card > summary::before { content: "▸"; color: var(--muted); font-size: 11px; }
    .tool-card[open] > summary::before { content: "▾"; }
    .tool-card .tool-name {
      color: var(--text); font-weight: 650; font-family: ui-monospace, Consolas, monospace;
      font-size: 12px;
    }
    .tool-body { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 10px; }
    .tool-abs { display: flex; flex-direction: column; gap: 4px; }
    .tool-abs b { color: var(--text); font-weight: 600; font-size: 11px; letter-spacing: .03em; text-transform: uppercase; }
    .tool-url { font-family: ui-monospace, Consolas, monospace; font-size: 11px; color: var(--ki); word-break: break-all; }
    .tool-json {
      margin: 0; padding: 8px 10px; background: #120e11; border: 1px solid var(--line);
      border-radius: 8px; overflow: auto; max-height: 220px; color: var(--user);
      font-family: ui-monospace, Consolas, monospace; font-size: 11px; line-height: 1.45;
      white-space: pre-wrap; word-break: break-word;
    }
    .tool-kopf { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .tool-upd { display: flex; flex-direction: column; gap: 4px; }
    .tool-upd-zeile { font-family: ui-monospace, Consolas, monospace; font-size: 11px; }
    .tool-upd-zeile .von { color: #8a6a78; text-decoration: line-through; }
    .tool-upd-zeile .nach { color: var(--gut); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Anrufe</h1>
        <div class="sub">Bianca — Unterhaltungen mit Audio, Transkript, Tools und Zeiten</div>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="knopf" id="neuLaden" type="button">Neu laden</button>
        <a class="knopf" href=".">Zum Dock</a>
      </div>
    </header>
    <div class="grid">
      <section class="card">
        <h2>Unterhaltungen</h2>
        <div class="liste" id="liste"><div class="leer">lade …</div></div>
      </section>
      <section class="card">
        <h2>Gespräch</h2>
        <div id="detail"><div class="leer">links einen Anruf wählen</div></div>
      </section>
    </div>
  </div>
  <audio id="spieler" hidden></audio>
  <script src="anrufe.js?v=a6"></script>
</body>
</html>
