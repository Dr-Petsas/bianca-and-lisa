<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Bianca ? Patiententelefon</title>
  <link rel="stylesheet" href="styles.css?v=b11" />
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Bianca</h1>
        <div class="sub tts-info" id="ttsInfo"></div>
      </div>
      <div class="header-status">
        <div class="studio-links">
          <button class="studio-link" id="studioBtn" type="button">Test-Studio</button>
          <button class="studio-link" id="ergebnisseBtn" type="button">Ergebnisse</button>
        </div>
        <div class="sub last-call" id="lastCall"></div>
      </div>
    </header>

    <!-- Mandant bleibt fuer den Start-Aufruf noetig, ist aber kein
         sichtbares Element mehr (Chef 27.08.2026: Erklaer-Box weg). -->
    <select id="tenant" hidden></select>

    <div class="grid">
      <section class="card">
        <h2>Stand</h2>
        <div class="sub" id="stand">noch kein Anruf</div>
      </section>
    </div>
    <div class="status" id="status"></div>
  </div>
  <div class="toast" id="toast" hidden></div>

  <div id="call" class="call">
    <div class="call-top">
      <div class="call-name" id="callName">Bianca</div>
      <div class="call-phase" id="phase">verbindet?</div>
    </div>
    <div class="call-pulse" id="pulse"></div>
    <div class="live call-live" id="live"></div>
    <button class="btn hang" id="hang" type="button">Auflegen</button>
  </div>

  <!-- Anruf-Knopf FIX am unteren Rand (Chef 27.08.: auf beiden Tabs an
       derselben Stelle) ? der Inhalt bekommt per body-Padding Platz,
       nichts verschwindet hinter der Leiste. -->
  <!-- "Das kann ich" (Chef 29.08.2026): Schaufenster mit allem, was Bianca
       kann, plus Technik-Reiter (Pipelines + alle Patches tabellarisch).
       Reine Anzeige ? der Anruf-Pfad bleibt unberuehrt. -->
  <div id="koennen" class="koennen" hidden>
    <div class="k-kopf">
      <div>
        <div class="k-titel">Das kann ich</div>
        <div class="sub">Bianca ? Patiententelefon ù Stand 29.08.2026</div>
      </div>
      <button class="k-zu" id="koennenZu" type="button">Schlieùen</button>
    </div>
    <div class="k-tabs">
      <button class="k-tab aktiv" data-tab="faehig" type="button">Kùnnen</button>
      <button class="k-tab" data-tab="technik" type="button">Technik</button>
    </div>
    <div class="k-inhalt" id="kInhalt"></div>
  </div>

  <div id="studio" class="koennen studio-overlay" hidden>
    <div class="k-kopf">
      <div class="k-titel" id="studioTitel">Test-Studio</div>
      <button class="k-zu" id="studioZu" type="button">Schlieùen</button>
    </div>
    <iframe id="studioRahmen" class="studio-rahmen" title="Test-Studio" allow="autoplay; fullscreen"></iframe>
  </div>

  <div class="dock" id="dock">
    <button class="btn neben" id="koennenBtn" type="button">Das kann ich</button>
    <button class="btn" id="start" type="button">Bei Bianca anrufen</button>
  </div>
  <audio id="speaker" playsinline webkit-playsinline hidden></audio>
  <script src="app.js?v=b26"></script>
</body>
</html>
